version: '3.9'
services:
  db:
    image: postgres:16
    container_name: rttm-kpi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rttm_kpi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "4000:4000"

  web:
    build:
      context: ./apps/web
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
